name: build-wda

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 40
    steps:
      - name: checkout WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          path: wda

      - name: toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: build-for-testing
        working-directory: wda
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -60

      - name: package
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/dd" -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "!! 没找到 WebDriverAgentRunner-Runner.app"
            find "$RUNNER_TEMP/dd" -name "*.app" -maxdepth 8
            exit 1
          fi
          echo "APP=$APP"
          echo '' | base64 -d > "$RUNNER_TEMP/ent.plist"
          echo "--- entitlements ---"
          cat "$RUNNER_TEMP/ent.plist"
          BIN="$APP/WebDriverAgentRunner-Runner"
          echo "--- 架构 ---"
          lipo -info "$BIN" || file "$BIN"
          echo "--- 先签内嵌 framework，再签主 bundle ---"
          find "$APP" -name "*.framework" -maxdepth 4 -print0 | while IFS= read -r -d '' f; do
            codesign --force --sign - "$f" 2>&1 | head -2 || true
          done
          codesign --force --sign - --entitlements "$RUNNER_TEMP/ent.plist" "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | head -30 || true
          mkdir -p "$RUNNER_TEMP/Payload"
          rm -rf "$RUNNER_TEMP/Payload/"*.app
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          rm -f WebDriverAgent.ipa
          zip -qry WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa
          unzip -l WebDriverAgent.ipa | head -20

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa
          path: ${{ runner.temp }}/WebDriverAgent.ipa
          retention-days: 3
