name: build-wda

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runner 镜像（macos-15 / macos-14 / macos-latest）"
        required: false
        default: "macos-15"
  push:
    branches: [main]

# macos-13 已在 2025 年被 GitHub 淘汰，挂 macos-13 的 job 会永久 queued 不分配机器。
# 现在能用的 macOS 池是 macos-14 / macos-15 / macos-latest。
jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - name: checkout WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          path: wda

      - name: toolchain
        run: |
          echo "runner=${{ runner.os }}/${{ runner.arch }}  image=$RUNNER_IMAGE_OS"
          for X in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.0.app                    /Applications/Xcode_15.4.app /Applications/Xcode_15.2.app /Applications/Xcode.app; do
            if [ -d "$X" ]; then sudo xcode-select -s "$X"; echo "使用 $X"; break; fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "DEVELOPER_DIR=$(xcode-select -p)"

      - name: build-for-testing
        working-directory: wda
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -60

      - name: package
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/dd" -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "!! 没找到 WebDriverAgentRunner-Runner.app"
            find "$RUNNER_TEMP/dd" -name "*.app" -maxdepth 8
            exit 1
          fi
          echo "APP=$APP"
          BIN="$APP/WebDriverAgentRunner-Runner"
          lipo -info "$BIN" || file "$BIN"

          # ── 1. 把 XCTest 运行时从 Xcode 的 iPhoneOS 平台目录搬进 app ──
          # build-for-testing 不会把 XCTest.framework 打进 Runner.app，
          # 真机上也没有 /Developer 目录，缺了它 WDA 一启动就 dyld 找不到符号。
          DEV=$(xcode-select -p)
          PLAT="$DEV/Platforms/iPhoneOS.platform/Developer"
          mkdir -p "$APP/Frameworks"
          echo "--- 平台框架目录 ---"
          ls "$PLAT/Library/Frameworks" 2>/dev/null || true
          ls "$PLAT/Library/PrivateFrameworks" 2>/dev/null | head -20 || true
          for fw in XCTest XCTAutomationSupport XCUIAutomation; do
            for base in "$PLAT/Library/Frameworks" "$PLAT/Library/PrivateFrameworks"; do
              if [ -d "$base/$fw.framework" ]; then
                cp -R "$base/$fw.framework" "$APP/Frameworks/"
                echo "  + $fw.framework  <- $base"
                break
              fi
            done
          done
          # 有些 Xcode 版本把 XCTest 放在 usr/lib 下的 libXCTestBundleInject
          cp "$PLAT/usr/lib/libXCTestBundleInject.dylib" "$APP/Frameworks/" 2>/dev/null && echo "  + libXCTestBundleInject.dylib" || true

          # ── 2. 改 load command：把 /Developer/... 的绝对路径换成 @rpath ──
          ABS_XCTEST="/Developer/Library/Frameworks/XCTest.framework/XCTest"
          ABS_XAS="/Developer/Library/PrivateFrameworks/XCTAutomationSupport.framework/XCTAutomationSupport"
          ABS_XCUI="/Developer/Library/PrivateFrameworks/XCUIAutomation.framework/XCUIAutomation"
          fix() {
            b="$1"
            [ -f "$b" ] || return 0
            file "$b" | grep -q "Mach-O" || return 0
            install_name_tool -change "$ABS_XCTEST" "@rpath/XCTest.framework/XCTest" "$b" 2>/dev/null || true
            install_name_tool -change "$ABS_XAS" "@rpath/XCTAutomationSupport.framework/XCTAutomationSupport" "$b" 2>/dev/null || true
            install_name_tool -change "$ABS_XCUI" "@rpath/XCUIAutomation.framework/XCUIAutomation" "$b" 2>/dev/null || true
            install_name_tool -add_rpath "@executable_path/Frameworks" "$b" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path/Frameworks" "$b" 2>/dev/null || true
          }
          for f in "$APP/Frameworks/"*.framework; do
            [ -d "$f" ] || continue
            nm=$(basename "$f" .framework)
            install_name_tool -id "@rpath/$nm.framework/$nm" "$f/$nm" 2>/dev/null || true
            fix "$f/$nm"
          done
          fix "$BIN"
          # xctest bundle 里的二进制也要改
          find "$APP" -name "*.xctest" -type d | while read -r x; do
            fix "$x/$(basename "$x" .xctest)"
          done

          echo "--- Runner 依赖 ---"
          otool -L "$BIN" | head -20
          echo "--- rpath ---"
          otool -l "$BIN" | grep -A2 LC_RPATH | head -20

          # ── 3. 重签：先 framework 后 app，TrollStore 靠 CoreTrust 放行 ad-hoc ──
          echo '' | base64 -d > "$RUNNER_TEMP/ent.plist"
          find "$APP/Frameworks" -name "*.framework" -maxdepth 2 -print0 2>/dev/null | while IFS= read -r -d '' f; do
            codesign --force --sign - "$f" 2>&1 | head -1 || true
          done
          find "$APP" -name "*.dylib" -print0 2>/dev/null | while IFS= read -r -d '' f; do
            codesign --force --sign - "$f" 2>&1 | head -1 || true
          done
          codesign --force --sign - --entitlements "$RUNNER_TEMP/ent.plist" "$APP"
          echo "--- 签名结果 ---"
          codesign -dv --entitlements - "$APP" 2>&1 | head -30 || true

          # ── 4. 打包 ──
          mkdir -p "$RUNNER_TEMP/Payload"
          rm -rf "$RUNNER_TEMP/Payload/"*.app
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          rm -f WebDriverAgent.ipa
          zip -qry WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa
          echo "--- ipa 结构（Frameworks 必须在）---"
          unzip -l WebDriverAgent.ipa | grep -E "Frameworks/|Runner.app/$|Info.plist" | head -20

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa
          path: ${{ runner.temp }}/WebDriverAgent.ipa
          retention-days: 3
