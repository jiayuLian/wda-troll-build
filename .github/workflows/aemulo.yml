name: aemulo-rename
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'aemulo-rename/**'
      - '.github/workflows/aemulo.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld xz-utils file
          clang --version | head -2
          which ld64.lld ld.lld || true
          ls /usr/lib/llvm-*/bin/ | grep -i 'ld64' || true

      - name: iOS SDK (sparse checkout)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdksrc
          cd sdksrc && git sparse-checkout set iPhoneOS16.5.sdk
          du -sh iPhoneOS16.5.sdk
          ls iPhoneOS16.5.sdk

      - name: Build dylib
        working-directory: aemulo-rename
        run: |
          set -x
          SDK="$GITHUB_WORKSPACE/sdksrc/iPhoneOS16.5.sdk"
          mkdir -p out
          clang -target arm64-apple-ios14.0 \
            -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -O2 -fuse-ld=lld \
            -Wl,-platform_version,ios,14.0,16.5 \
            -Wl,-install_name,@executable_path/Frameworks/AemuloRename.dylib \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -lsqlite3 -lobjc \
            -o out/AemuloRename.dylib AemuloRename.m
          file out/AemuloRename.dylib
          ls -la out/

      - name: Verify
        working-directory: aemulo-rename
        run: |
          set -e
          python3 - <<'PY'
          import struct,sys
          p='out/AemuloRename.dylib'
          d=open(p,'rb').read()
          magic=struct.unpack('<I',d[:4])[0]
          cpu=struct.unpack('<i',d[4:8])[0]
          ft=struct.unpack('<I',d[12:16])[0]
          print('magic=%#x cpu=%#x filetype=%d size=%d'%(magic,cpu,ft,len(d)))
          assert magic==0xfeedfacf, 'not Mach-O 64'
          assert cpu==0x100000c, 'not arm64'
          assert ft==6, 'not MH_DYLIB'
          import re
          m=re.findall(rb'AG_VER_V[0-9]+', d)
          print('marker:', m)
          assert m, 'version marker missing'
          print('OK')
          PY
          if strings out/AemuloRename.dylib | grep -qi 'substrate\|ellekit'; then
            echo "FATAL: substrate referenced"; exit 1
          fi
          strings out/AemuloRename.dylib | grep -c 'AemuloRename' || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AemuloRename
          path: aemulo-rename/out/AemuloRename.dylib
